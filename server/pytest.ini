[pytest]
pythonpath = .
filterwarnings =
    # The dev/test JWT secret is deliberately short; production requires a
    # real secret (and the app refuses to boot without one).
    ignore::jwt.warnings.InsecureKeyLengthWarning
    # passlib 1.7.4 imports the deprecated `crypt` module on Python 3.12.
    ignore:.*'crypt' is deprecated.*:DeprecationWarning
